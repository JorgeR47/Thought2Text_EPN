# Ejecuta la prueba de humo del pipeline completo en cada pull request y en cada
# cambio a main. Si algo se rompe, GitHub marca el PR con una X roja.
name: Prueba del pipeline

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:   # permite ejecutarla a mano desde la pestaña Actions

jobs:
  pipeline-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"   # las versiones de requirements.txt no instalan en 3.12+
          cache: pip

      - name: Instalar dependencias (versiones del paper)
        run: |
          python -m pip install --upgrade pip
          # PyTorch 2.4.1 en su versión para CPU (mucho más liviana que la de GPU)
          pip install torch==2.4.1 --index-url https://download.pytorch.org/whl/cpu
          # requirements.txt + fijaciones necesarias para que esas versiones funcionen hoy
          pip install -r requirements.txt "numpy<2" evaluate==0.4.2 datasets==2.20.0 \
            pyarrow==16.1.0 "huggingface-hub<1.0"

      - name: Ejecutar el pipeline completo con datos de prueba
        run: bash tests/run_pipeline.sh python "$RUNNER_TEMP/t2t_prueba"
